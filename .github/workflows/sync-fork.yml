name: Sync fork with upstream

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-fork-main
  cancel-in-progress: false

jobs:
  sync:
    name: Sync fork
    runs-on: ubuntu-latest
    if: github.repository == 'BINGHUAice/HGhubX'

    steps:
      - name: Sync main with the upstream fork parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" \
            --raw-field branch=main
